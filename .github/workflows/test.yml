name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release, Sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git pkg-config libsystemd-dev libx11-dev libxcb1-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-ewmh-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xtest0-dev xvfb xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils
      - name: Configure
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = Sanitizers ]; then
            cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DLWM_SANITIZERS=ON
          else
            cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE="$MODE"
          fi
      - name: Build
        run: cmake --build build -j2
      - name: Tests
        env:
          LWM_TEST_REQUIRE_X11: '1'
        run: |
          build/tests/lwm_tests
          build/tests/lwm_logging_tests
          ctest --test-dir build -R '^uninstall_manifest$' --output-on-failure
      - name: Multi-output topology
        env:
          LWM_TEST_REQUIRE_X11: '1'
          LWM_TEST_XSERVER: Xorg
        run: build/tests/lwm_tests '[multioutput]'
      - name: Request budgets and concurrent load
        if: matrix.mode == 'Release'
        run: |
          python3 tests/performance/transition_counts.py build/src/app/lwm --check
          python3 tests/performance/ipc_load.py build/src/app/lwm --x-flood --check
      - name: Longer sequences
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LWM_TEST_REQUIRE_X11: '1'
          LWM_TEST_SEQUENCE_STEPS: '3000'
        run: |
          for seed in 0 1 89372 4294967295; do
            LWM_TEST_SEQUENCE_SEED="$seed" build/tests/lwm_tests '[sequence]'
          done
